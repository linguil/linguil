{
  "specVersion": "v1alpha1",
  "endpoints": {
    "fsexportbigquery": {
      "ingressSettings": "ALLOW_INTERNAL_ONLY",
      "concurrency": 1,
      "serviceAccountEmail": null,
      "vpc": null,
      "platform": "gcfv2",
      "labels": {},
      "region": "{{ params.FUNCTION_DEFAULT_REGION }}",
      "cpu": "gcf_gen1",
      "eventTrigger": {
        "eventType": "google.cloud.firestore.document.v1.written",
        "eventFilters": {
          "database": "{{ params.DATABASE }}",
          "namespace": "(default)"
        },
        "eventFilterPathPatterns": {
          "document": "{{ params.COLLECTION_PATH }}/{documentId}"
        },
        "retry": false
      },
      "entryPoint": "fsexportbigquery"
    },
    "syncBigQuery": {
      "platform": "gcfv2",
      "timeoutSeconds": 540,
      "maxInstances": 500,
      "concurrency": 1,
      "serviceAccountEmail": null,
      "vpc": null,
      "labels": {},
      "region": "{{ params.FUNCTION_DEFAULT_REGION }}",
      "cpu": "gcf_gen1",
      "taskQueueTrigger": {
        "retryConfig": {
          "maxAttempts": 5,
          "maxDoublings": null,
          "maxBackoffSeconds": null,
          "maxRetrySeconds": null,
          "minBackoffSeconds": 60
        },
        "rateLimits": {
          "maxConcurrentDispatches": 500,
          "maxDispatchesPerSecond": "{{ params.MAX_DISPATCHES_PER_SECOND < 1 ? 100 : params.MAX_DISPATCHES_PER_SECOND }}"
        }
      },
      "entryPoint": "syncBigQuery"
    },
    "initBigQuerySync": {
      "platform": "gcfv2",
      "timeoutSeconds": 540,
      "concurrency": 1,
      "serviceAccountEmail": null,
      "vpc": null,
      "labels": {},
      "region": "{{ params.FUNCTION_DEFAULT_REGION }}",
      "cpu": "gcf_gen1",
      "taskQueueTrigger": {
        "retryConfig": {
          "maxAttempts": 15,
          "maxDoublings": null,
          "maxBackoffSeconds": null,
          "maxRetrySeconds": null,
          "minBackoffSeconds": 60
        },
        "rateLimits": {
          "maxConcurrentDispatches": null,
          "maxDispatchesPerSecond": null
        }
      },
      "entryPoint": "initBigQuerySync"
    },
    "setupBigQuerySync": {
      "platform": "gcfv2",
      "timeoutSeconds": 540,
      "concurrency": 1,
      "serviceAccountEmail": null,
      "vpc": null,
      "labels": {},
      "region": "{{ params.FUNCTION_DEFAULT_REGION }}",
      "cpu": "gcf_gen1",
      "taskQueueTrigger": {
        "retryConfig": {
          "maxAttempts": 15,
          "maxDoublings": null,
          "maxBackoffSeconds": null,
          "maxRetrySeconds": null,
          "minBackoffSeconds": 60
        },
        "rateLimits": {
          "maxConcurrentDispatches": null,
          "maxDispatchesPerSecond": null
        }
      },
      "entryPoint": "setupBigQuerySync"
    }
  },
  "params": [
    {
      "name": "FUNCTION_DEFAULT_REGION",
      "input": {
        "text": {
          "nonEmpty": true
        }
      },
      "description": "Global default region where functions should be deployed. Can be overriden per-function.",
      "type": "string"
    },
    {
      "name": "BIGQUERY_PROJECT_ID",
      "label": "BigQuery Project ID",
      "description": "Override the default project for BigQuery instance. This can allow updates to be directed to to a BigQuery instance on another GCP project.",
      "input": {
        "text": {
          "nonEmpty": true
        }
      },
      "type": "string",
      "default": "{{ params.PROJECT_ID }}"
    },
    {
