          "example": "firestore_export",
          "validationRegex": "^[a-zA-Z0-9_]+$",
          "validationErrorMessage": "BigQuery dataset IDs must be alphanumeric (plus underscores) and must be no more than 1024 characters."
        }
      },
      "type": "string",
      "default": "firestore_export"
